name: Sync stable Mihomo bundle

on:
  schedule:
    - cron: "23 4 * * *"
  # Unlike workflow_dispatch, repository_dispatch always loads this workflow
  # from the default branch and does not let the caller select another ref.
  repository_dispatch:
    types: [sync-stable-mihomo]

permissions:
  contents: read

concurrency:
  group: sync-stable-mihomo
  cancel-in-progress: false

jobs:
  resolve-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Resolve the trusted main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Record the immutable base commit
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the resolved main commit without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-main.outputs.sha }}
          persist-credentials: false

      - name: Install sync dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq

      - name: Test the sync contract
        run: tests/sync-mihomo.sh

      - name: Download and verify the latest stable bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/sync-mihomo.sh

      - name: Run the candidate as an unprivileged user
        shell: bash
        run: |
          bundle=resources/zip/mihomo-linux-amd64-v1.gz
          manifest=resources/mihomo.lock.tsv
          bundle_sha=$(sha256sum "$bundle" | awk '{ print $1 }')
          manifest_sha=$(sha256sum "$manifest" | awk '{ print $1 }')
          MIHOMO_BUNDLE_EXECUTE=false tests/bundle.sh
          verify_dir=$(mktemp -d)
          trap 'rm -rf -- "$verify_dir"' EXIT
          gzip -dc "$bundle" > "$verify_dir/mihomo"
          chmod 0755 "$verify_dir" "$verify_dir/mihomo"
          version=$(awk -F '\t' '$1 == "asset" { print $5 }' "$manifest")
          output=$(sudo -u nobody env -i PATH=/usr/bin:/bin \
            timeout --kill-after=5 30 "$verify_dir/mihomo" -v 2>&1)
          actual=$(printf '%s\n' "$output" | tools/parse-mihomo-version.sh)
          test "$actual" = "$version"
          test "$(sha256sum "$bundle" | awk '{ print $1 }')" = "$bundle_sha"
          test "$(sha256sum "$manifest" | awk '{ print $1 }')" = "$manifest_sha"
          mkdir mihomo-artifact
          cp resources/mihomo.lock.tsv mihomo-artifact/
          cp resources/zip/mihomo-linux-amd64-v1.gz mihomo-artifact/

      - name: Upload verified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-mihomo
          path: mihomo-artifact/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve-main, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the same resolved main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-main.outputs.sha }}

      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stable-mihomo
          path: mihomo-artifact

      - name: Install and verify artifact without executing it
        shell: bash
        run: |
          cp mihomo-artifact/mihomo.lock.tsv resources/mihomo.lock.tsv
          cp mihomo-artifact/mihomo-linux-amd64-v1.gz resources/zip/mihomo-linux-amd64-v1.gz
          MIHOMO_BUNDLE_EXECUTE=false tests/bundle.sh
          find resources/zip -maxdepth 1 -type f \
            -name 'mihomo-linux-amd64*.gz' \
            ! -name 'mihomo-linux-amd64-v1.gz' -delete

      - name: Stage bundle metadata
        id: changes
        shell: bash
        run: |
          git add -A -- 'resources/zip/mihomo-linux-amd64*.gz' resources/mihomo.lock.tsv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          base_sha=${{ needs.resolve-main.outputs.sha }}
          version=$(awk -F '\t' '$1 == "asset" { print $5 }' resources/mihomo.lock.tsv)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Mihomo ${version}"
          remote_sha=$(git ls-remote --exit-code origin refs/heads/main | awk '{ print $1 }')
          if [ "$remote_sha" != "$base_sha" ]; then
            echo "main advanced after verification; refusing to publish an unverified rebase" >&2
            exit 1
          fi
          git push origin HEAD:main
